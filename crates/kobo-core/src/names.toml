# Names Kobo writes after the numbers the game uses: trailing comments in
# project files, and labels in the editor. Read by `kobo_core::names`.
#
# One `ID = "Name"` per line, the id as two upper-case hex digits, in order.
# Every number a table covers has a line; "Unused" marks a number the game
# does nothing sensible with. Names are ASCII, one line, at most 44
# characters, and distinct within a table except "Unused". Level mode names
# live with `level::LevelMode`, the one place that says what a mode means.
#
# Written from the game's own dispatch tables and data (read through the
# SMWDisX disassembly), the community's documentation of the level format,
# and the levels themselves; docs/smw.md has the facts they rest on.

# Standard objects every object set shares. 22-2D run the water surface
# routine past the end of its table in the game, and no level uses them;
# Lunar Magic takes 22-29 and 2D over (see `lunar_magic_objects`).
[objects]
01 = "Water, blue"
02 = "Invisible coin block"
03 = "Invisible note block"
04 = "Invisible P-switch coin"
05 = "Coin"
06 = "Walk-through dirt"
07 = "Water, other colour"
08 = "Note block"
09 = "Turn block"
0A = "? block, coin"
0B = "Throw block"
0C = "Muncher"
