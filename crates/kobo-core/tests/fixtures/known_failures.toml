# What the corpus tests are known to fail, hack by hack (tests/common/failures.rs).
#
# A corpus test fails on a failure this list does not hold, and on one it
# holds that did not happen on a hack the test ran on: take an entry out as
# soon as its gap is fixed. Each entry is one hack (its headerless SHA-1;
# `kobo rom info` prints it, after `kobo bps apply` for a patch), the tests
# (`binary::test`, comma-separated), the levels (hex, or "all" for every
# level and the ROM as a whole), and why.

