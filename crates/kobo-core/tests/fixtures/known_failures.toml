hack = "Smb2dx.smc"
sha1 = "37ea8b33add914cb00983e41778d038d31b777f9"
tests = "corpus_levels::lunar_magic_levels_load_as_the_hacks_have_them"
levels = "all"
reason = "Lunar Magic 1.63: its mode $00 levels carry object layer 2 pointers, so 173 backgrounds do not match the upload."

