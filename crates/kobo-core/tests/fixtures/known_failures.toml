# What the corpus tests are known to fail, hack by hack (tests/common/failures.rs).
#
# A corpus test fails on a failure this list does not hold, and on one it
# holds that did not happen on a hack the test ran on: take an entry out as
# soon as its gap is fixed. Each entry is one hack (its headerless SHA-1;
# `kobo rom info` prints it, after `kobo bps apply` for a patch), the tests
# (`binary::test`, comma-separated), the levels (hex, or "all" for every
# level and the ROM as a whole), and why.

[[failure]]
hack = "Smb2dx.smc"
sha1 = "37ea8b33add914cb00983e41778d038d31b777f9"
tests = "corpus_levels::lunar_magic_levels_load_as_the_hacks_have_them"
levels = "all"
reason = "Lunar Magic 1.63: its mode $00 levels carry object layer 2 pointers, so 173 backgrounds do not match the upload."

[[failure]]
hack = "Grand Poo World 2.smc"
sha1 = "390583d5faa0cc02e0c4f414f7638228661b2dc9"
tests = "corpus_levels::lunar_magic_levels_load_as_the_hacks_have_them"
levels = ["09F"]
reason = "An unused slot with no background table: its definitions come from bank 0 work RAM as it stood at the upload, which the loaded level's RAM no longer is."

[[failure]]
hack = "QLDC 2021/34_idol.bps"
sha1 = "4236c2f097677097e2395928b2454898af3b9f11"
tests = "corpus_levels::lunar_magic_levels_load_as_the_hacks_have_them"
levels = ["012", "016", "038", "08F", "090", "0B1", "0EB", "113", "13F"]
reason = "Nine slots the hack itself cannot load: its object pre-scan runs over bank 0 (known-gaps.md)."

