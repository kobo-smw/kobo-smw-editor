# cargo-deny's configuration; CI runs `cargo deny check licenses`.
#
# Kobo is MPL-2.0, and every dependency must be under a licence compatible
# with it. Add one here only after checking it is.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots and webpki-root-certs: Mozilla's root certificates, as data.
    "CDLA-Permissive-2.0",
    # The Boost licence, permissive: clipboard-win and error-code, the
    # editor's clipboard on Windows.
    "BSL-1.0",
]
confidence-threshold = 0.9

# Licences allowed for one crate only.
[[licenses.exceptions]]
# The editor's file watcher: a public domain dedication.
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
# egui's built-in fonts, as data: Ubuntu, Hack, Noto Emoji, and its icon
# font, under the SIL Open Font Licence and the Ubuntu Font Licence, which
# let them be bundled with software under any licence.
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]
