[workspace]
resolver = "3"
members = ["crates/kobo-core", "crates/kobo-cli", "crates/kobo-editor", "crates/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/kobo-smw/kobo-smw-editor"
rust-version = "1.98"

[workspace.dependencies]
kobo-core = { path = "crates/kobo-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# The editor: egui on its OpenGL renderer, with AccessKit (docs/step-3.md).
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_kittest = "0.36"
flate2 = "1"
libc = "0.2"
libloading = "0.9"
# Watching a project's files for the editor (CC0-1.0).
notify = "8"
png = "0.17"
# The editor's file dialogs, through the XDG portal on Linux.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "0.9"
toml_edit = "0.25"
# Downloads the pinned tool builds, over rustls with ring and webpki-roots.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[workspace.lints.clippy]
all = "warn"

# The ROM-backed tests run the game's own code in Kobo's 65816 core, which
# unoptimised is about seven times slower: a plain `cargo test` optimises
# kobo-core, keeping debug assertions and overflow checks. For a debugger,
# CARGO_PROFILE_DEV_PACKAGE_KOBO_CORE_OPT_LEVEL=0.
[profile.dev.package.kobo-core]
opt-level = 2
